[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dsservice"
version = "0.1.0"
description = "Flask + Kafka service for handling messages"
authors = [{ name = "Pankaj", email = "pankaj@gmail.com" }]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "flask",
    "kafka-python",
    "jsonpickle"
]

[tool.setuptools.packages.find]
where = ["src"]
